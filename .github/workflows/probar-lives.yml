name: Probar Facebook Live Bolivia

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Cantidad de fuentes a probar (0 = todas)"
        required: false
        default: "5"
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: probar-lives
  cancel-in-progress: false

jobs:
  detectar-lives:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium y dependencias del sistema
        run: python -m playwright install --with-deps chromium

      - name: Restaurar estado (cache/cooldown) de corridas anteriores
        uses: actions/cache@v4
        with:
          path: .facebook_live_estado.json
          key: estado-facebook-live-${{ github.run_id }}
          restore-keys: |
            estado-facebook-live-

      - name: Ejecutar detector
        shell: bash
        run: |
          LIMITE="${{ inputs.limite }}"
          FORZAR_FLAG=""
          if [ "${{ inputs.forzar }}" = "true" ]; then
            FORZAR_FLAG="--force"
          fi
          if [ -z "$LIMITE" ] || [ "$LIMITE" = "0" ]; then
            python facebook_live_bolivia.py $FORZAR_FLAG
          else
            python facebook_live_bolivia.py --limit "$LIMITE" $FORZAR_FLAG
          fi

      - name: Mostrar resumen
        if: always()
        run: |
          echo "=== Archivos generados ==="
          ls -lah *.json 2>/dev/null || true
          echo "=== Lives detectados ==="
          cat lives_bolivia.json 2>/dev/null || true

      - name: Guardar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-facebook-live-bolivia
          path: |
            resultado_facebook_bolivia.json
            lives_bolivia.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar lives_bolivia.json en el repo
        if: always()
        shell: bash
        run: |
          if [ ! -f lives_bolivia.json ]; then
            echo "No hay lives_bolivia.json que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lives_bolivia.json resultado_facebook_bolivia.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados, no se hace commit."
            exit 0
          fi
          git commit -m "Actualizar resultados de lives [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push falló (posible carrera con otra corrida), reintentando ($i)..."
            sleep 5
          done
