name: Probar Facebook Live Bolivia - Grupo 3

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    # Fuentes 43-63 de fuentes.json. Los 4 grupos corren cada media hora, en paralelo.
    - cron: "0,30 * * * *"

jobs:
  escanear:
    permissions:
      contents: write
    uses: ./.github/workflows/_probar-lives-grupo.yml
    with:
      grupo: grupo3
      offset: 42
      limit: 21
      forzar: ${{ inputs.forzar == true }}
