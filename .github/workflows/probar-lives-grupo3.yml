name: Probar Facebook Live Bolivia - Grupo 3

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    # Parte 3 de 9 de fuentes.json. El script calcula qué fuentes le tocan
    # (--grupo/--de), así que agregar canales no obliga a editar este archivo.
    # Los grupos arrancan escalonados cada 3 minutos para no golpear Facebook en ráfaga.
    - cron: "6,36 * * * *"

jobs:
  escanear:
    permissions:
      contents: write
    uses: ./.github/workflows/_probar-lives-grupo.yml
    with:
      numero: 3
      total: 9
      forzar: ${{ inputs.forzar == true }}
