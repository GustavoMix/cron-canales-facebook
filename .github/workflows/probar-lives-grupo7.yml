name: Probar Facebook Live Bolivia - Grupo 7 (Radios)

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    # Fuentes 118-128 de fuentes.json: radios bolivianas (Facebook). Ocupa el lugar
    # que tenía el grupo de YouTube, que se sacó para no mezclar plataformas.
    - cron: "0,30 * * * *"

jobs:
  escanear:
    permissions:
      contents: write
    uses: ./.github/workflows/_probar-lives-grupo.yml
    with:
      grupo: grupo7
      offset: 117
      limit: 11
      forzar: ${{ inputs.forzar == true }}
