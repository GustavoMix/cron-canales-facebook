name: Probar Facebook Live Bolivia - Grupo 6 (Nuevas fuentes nacionales)

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    # Fuentes 84-117 de fuentes.json: 34 canales/radios bolivianos nuevos, agregados
    # aparte de los grupos 1-4 para no aumentar el tiempo de corrida de esos grupos
    # que ya venían funcionando bien. Corre junto a los otros grupos.
    - cron: "0,30 * * * *"

jobs:
  escanear:
    permissions:
      contents: write
    uses: ./.github/workflows/_probar-lives-grupo.yml
    with:
      grupo: grupo6
      offset: 83
      limit: 34
      forzar: ${{ inputs.forzar == true }}
