name: Probar Facebook Live Bolivia - Grupo 4

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    # Fuentes 64-83 de fuentes.json (las bolivianas). El grupo 5 (canales
    # regionales/internacionales) es aparte y no entra en este rango.
    - cron: "0,30 * * * *"

jobs:
  escanear:
    permissions:
      contents: write
    uses: ./.github/workflows/_probar-lives-grupo.yml
    with:
      grupo: grupo4
      offset: 63
      limit: 20
      forzar: ${{ inputs.forzar == true }}
