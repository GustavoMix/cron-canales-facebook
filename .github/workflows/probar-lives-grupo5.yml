name: Probar Facebook Live Bolivia - Grupo 5 (Regional)

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar cooldown/cache y revisar aunque se haya revisado hace poco"
        type: boolean
        required: false
        default: false
  schedule:
    # Canales de noticias regionales/internacionales de transmisión continua
    # (fuentes 84 en adelante de fuentes.json). Corre junto a los otros 4 grupos.
    - cron: "0,30 * * * *"

jobs:
  escanear:
    permissions:
      contents: write
    uses: ./.github/workflows/_probar-lives-grupo.yml
    with:
      grupo: grupo5
      offset: 83
      limit: 0
      forzar: ${{ inputs.forzar == true }}
