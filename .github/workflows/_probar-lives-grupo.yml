name: Escanear grupo de fuentes (reusable)

on:
  workflow_call:
    inputs:
      numero:
        description: "Número de grupo (1..total)"
        required: true
        type: number
      total:
        description: "En cuántos grupos se reparte fuentes.json"
        required: true
        type: number
      forzar:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: probar-lives-grupo${{ inputs.numero }}
  cancel-in-progress: false

env:
  # El reparto lo calcula el script a partir de --grupo/--de, así que agregar fuentes
  # a fuentes.json NO obliga a tocar ningún workflow: los grupos se reacomodan solos.
  GRUPO: grupo${{ inputs.numero }}

jobs:
  detectar-lives:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium y dependencias del sistema
        run: python -m playwright install --with-deps chromium

      - name: Restaurar estado (cache/cooldown) de corridas anteriores
        uses: actions/cache@v4
        with:
          path: .facebook_live_estado.json
          key: estado-facebook-live-${{ github.run_id }}
          restore-keys: |
            estado-facebook-live-

      - name: Ejecutar detector
        shell: bash
        run: |
          FORZAR_FLAG=""
          if [ "${{ inputs.forzar }}" = "true" ]; then
            FORZAR_FLAG="--force"
          fi
          python facebook_live_bolivia.py \
            --grupo "${{ inputs.numero }}" \
            --de "${{ inputs.total }}" \
            --out-suffix "_$GRUPO" \
            $FORZAR_FLAG

      - name: Mostrar resumen
        if: always()
        run: |
          echo "=== Archivos generados ==="
          ls -lah *.json 2>/dev/null || true
          echo "=== Lives detectados en este grupo ==="
          cat "lives_bolivia_$GRUPO.json" 2>/dev/null || true

      - name: Guardar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-facebook-live-bolivia-grupo${{ inputs.numero }}
          path: |
            resultado_facebook_bolivia_grupo${{ inputs.numero }}.json
            lives_bolivia_grupo${{ inputs.numero }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar resultados de este grupo en el repo
        if: always()
        shell: bash
        run: |
          if [ ! -f "lives_bolivia_$GRUPO.json" ]; then
            echo "No hay lives_bolivia_$GRUPO.json que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "lives_bolivia_$GRUPO.json" "resultado_facebook_bolivia_$GRUPO.json"
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados de este grupo, no se hace commit."
          else
            git commit -m "Actualizar resultados de $GRUPO [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push falló (posible carrera con otro grupo), reintentando ($i)..."
              sleep 5
            done
          fi

      - name: Combinar los grupos en lives_bolivia.json / resultado_facebook_bolivia.json
        if: always()
        shell: bash
        run: |
          git pull --rebase origin main || true
          python facebook_live_bolivia.py --merge-de "${{ inputs.total }}"
          git add lives_bolivia.json resultado_facebook_bolivia.json \
                  salud_fuentes.json auditoria_deteccion.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el combinado, no se hace commit."
          else
            git commit -m "Actualizar combinado de lives [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push falló (posible carrera con otro grupo), reintentando ($i)..."
              sleep 5
            done
          fi
